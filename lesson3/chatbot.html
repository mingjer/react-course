<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }) {
          const [inputText, setInputText] = React.useState('');
          const [isLoading, setIsLoading] = React.useState(false);

          function saveInputText(event){
            setInputText(event.target.value);
          }

          async function sendMessage(){
            if (isLoading || inputText.trim() === ''){
              return
            }
            
            setIsLoading(true);

            console.log(inputText);

            const newMessages = [
              ...chatMessages,
              {
                message: inputText,
                sender: 'user',
                id: crypto.randomUUID()
              }
            ];

            setChatMessages([
              ...newMessages,
              {
                message: 'Loading...',
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);

            setInputText('')

            const response = await Chatbot.getResponseAsync(inputText);
            console.log(response);
            
            setChatMessages([
              ...newMessages,
              {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);

            setIsLoading(false);
          }

          function pressKeys(event){
            if (event.key === 'Enter'){
              sendMessage()
            }
            else if(event.key === 'Escape'){
              setInputText('')
            }
          }

          return (
            // fragment(<></>) = group elements without creating an extra <div
            <>
              <input 
                  placeholder = "Send a message to Chatbot" 
                  size = "30" 
                  onChange = {saveInputText}
                  value = {inputText}
                  onKeyDown = {pressKeys}
              />
              <button onClick = {sendMessage}>Send</button>
            </>
          );
        }

        // State = data that is connected to the HTML, 
        // when we update this data, it will update the HTML

        // Destructuring
        function ChatMessage({ message, sender }) {
        //   Destructuring
        //   const message = props.message;
        //   const sender = props.sender;
        //   const {message, sender} = props; // same as above

        //   if (sender === "robot") {
        //     return (
        //       <div>
        //           <img src = "robot.png" width = "50"/>
        //           {message}
        //       </div>
        //     );

        //   }
          return (
            <div>
                { sender === "robot" && (
                    <img src = "robot.png" width = "50" />
                )}
                {message}
                { sender === "user" && (
                    <img src = "user.png" width = "50" />
                )}
            </div>
          );
        }

        function ChatMessages({ chatMessages }){   
            return(
                <>
                  {chatMessages.map((chatMessage) => (
                      <ChatMessage 
                          key = {chatMessage.id}
                          message = {chatMessage.message} 
                          sender = {chatMessage.sender} 
                      />
                    ))
                  }
                </>
            );
        }
        
        
        function App(){
            // lifting the state up = share state between multiple components
            const [chatMessages, setChatMessages] = React.useState([
                {
                  message: "hello chatbot", 
                  sender: "user",
                  id: "id1"
                },
                {
                  message: "Hello! How can I help you?", 
                  sender: "robot",
                  id: "id2"
                }
            ]);
            // const [chatMessages, setChatMessages] = arr; // Array Destructuring
            // const chatMessages = arr[0]; // the current date
            // const setChatMessages = arr[1]; // the updater function
            return(
            <>
                <ChatInput 
                  chatMessages = {chatMessages}
                  setChatMessages = {setChatMessages}
                />
                <ChatMessages 
                  chatMessages = {chatMessages}
                />
            </>
            );
            // naming convention key the var name consistent
        }
        
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
